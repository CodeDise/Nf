services:
  - type: web
    name: cinepulse-autofilter-bot
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: API_ID
        sync: false
      - key: API_HASH
        sync: false
      - key: BOT_TOKEN
        sync: false
      - key: OWNER_ID
        sync: false
      - key: MASTER_DB_CHANNEL
        sync: false
      - key: BACKUP_DB_CHANNEL
        sync: false
      - key: MASTER_LOG_CHANNEL
        sync: false
      - key: MASTER_LOCK_CHANNEL
        sync: false
      - key: SUPPORT_ID
        value: CinePulseSupport
      - key: PRIMARY_MONGO_URI
        sync: false
      - key: TMDB_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: PORT
        value: 8080
